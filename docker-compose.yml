name: zlagent

services:
  zlagent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        APT_MIRROR_URL: ${APT_MIRROR_URL:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    image: zlagent:local
    container_name: zlagent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ZLAGENT_HOST: 0.0.0.0
      ZLAGENT_PORT: 8020
      ZLAGENT_LOG_LEVEL: ${ZLAGENT_LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
      ZLAGENT_REDIS_URL: redis://redis:6379/0
      ZLAGENT_DATABASE_URL: sqlite:////app/data/zlagent.sqlite3
      ZLAGENT_WORKSPACE_SEED_DIR: /app/workspace_seed
      ZLAGENT_BOOTSTRAP_WIKI_ON_STARTUP: ${ZLAGENT_BOOTSTRAP_WIKI_ON_STARTUP:-true}
      ZLAGENT_BOOTSTRAP_SKILLS_ON_STARTUP: ${ZLAGENT_BOOTSTRAP_SKILLS_ON_STARTUP:-true}
      ZLAGENT_DREAM_REVIEW_ENABLED: ${ZLAGENT_DREAM_REVIEW_ENABLED:-true}
      ZLAGENT_API_SCHEDULER_ENABLED: ${ZLAGENT_API_SCHEDULER_ENABLED:-false}
      ZLAGENT_DREAM_REVIEW_CRON: "${ZLAGENT_DREAM_REVIEW_CRON:-30 3 * * *}"
      ZLAGENT_DREAM_REVIEW_TIMEZONE: ${ZLAGENT_DREAM_REVIEW_TIMEZONE:-Asia/Shanghai}
      ZLAGENT_ADMIN_USERNAME: ${ZLAGENT_ADMIN_USERNAME:-admin}
      ZLAGENT_ADMIN_PASSWORD: ${ZLAGENT_ADMIN_PASSWORD:-zlagent-admin}
      ZLAGENT_JWT_SECRET: ${ZLAGENT_JWT_SECRET:-change-me-for-production}
      ZLAGENT_SEARXNG_URL: ${ZLAGENT_SEARXNG_URL:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "${ZLAGENT_HOST_PORT:-8020}:8020"
    volumes:
      - zlagent_data:/app/data
      - zlagent_config:/app/config
      - zlagent_workspace:/app/workspace
      - zlagent_packages:/app/.packages

  zlagent-worker:
    image: zlagent:local
    container_name: zlagent-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "backend.worker.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      ZLAGENT_REDIS_URL: redis://redis:6379/0
      ZLAGENT_DATABASE_URL: sqlite:////app/data/zlagent.sqlite3
      ZLAGENT_WORKSPACE_SEED_DIR: /app/workspace_seed
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - zlagent_data:/app/data
      - zlagent_config:/app/config
      - zlagent_workspace:/app/workspace
      - zlagent_packages:/app/.packages

  zlagent-scheduler:
    image: zlagent:local
    container_name: zlagent-scheduler
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "backend.worker.scheduler"]
    environment:
      ZLAGENT_REDIS_URL: redis://redis:6379/0
      ZLAGENT_DATABASE_URL: sqlite:////app/data/zlagent.sqlite3
      ZLAGENT_WORKSPACE_SEED_DIR: /app/workspace_seed
    env_file:
      - path: .env
        required: false
    volumes:
      - zlagent_data:/app/data
      - zlagent_config:/app/config
      - zlagent_workspace:/app/workspace

  redis:
    image: redis:7-alpine
    container_name: zlagent-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - zlagent_redis:/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: zlagent-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: zlagent
      POSTGRES_USER: zlagent
      POSTGRES_PASSWORD: zlagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zlagent -d zlagent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "${ZLAGENT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - zlagent_postgres:/var/lib/postgresql/data

volumes:
  zlagent_data:
  zlagent_config:
  zlagent_workspace:
  zlagent_redis:
  zlagent_packages:
  zlagent_postgres:
