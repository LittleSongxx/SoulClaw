name: soulclaw

services:
  soulclaw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        APT_MIRROR_URL: ${APT_MIRROR_URL:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    image: soulclaw:local
    container_name: soulclaw
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'
    environment:
      SOULCLAW_HOST: 0.0.0.0
      SOULCLAW_PORT: 8020
      SOULCLAW_LOG_LEVEL: ${SOULCLAW_LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SOULCLAW_LLM_PROVIDER: ${SOULCLAW_LLM_PROVIDER:-openai-compatible}
      SOULCLAW_LLM_CONTEXT_WINDOW_TOKENS: ${SOULCLAW_LLM_CONTEXT_WINDOW_TOKENS:-128000}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
      SOULCLAW_REDIS_URL: redis://redis:6379/0
      SOULCLAW_REDIS_REQUIRED: ${SOULCLAW_REDIS_REQUIRED:-false}
      SOULCLAW_DATABASE_URL: ${SOULCLAW_DATABASE_URL:-postgresql+psycopg://soulclaw:soulclaw@postgres:5432/soulclaw}
      SOULCLAW_AGENT_ENGINE: ${SOULCLAW_AGENT_ENGINE:-langgraph}
      SOULCLAW_VECTOR_MODE: ${SOULCLAW_VECTOR_MODE:-required}
      SOULCLAW_EMBEDDING_MODEL: ${SOULCLAW_EMBEDDING_MODEL:-text-embedding-3-small}
      SOULCLAW_EMBEDDING_DIMENSIONS: ${SOULCLAW_EMBEDDING_DIMENSIONS:-1536}
      SOULCLAW_EMBEDDING_BATCH_SIZE: ${SOULCLAW_EMBEDDING_BATCH_SIZE:-32}
      SOULCLAW_EMBEDDING_PASS_DIMENSIONS: ${SOULCLAW_EMBEDDING_PASS_DIMENSIONS:-true}
      SOULCLAW_WORKSPACE_SEED_DIR: /app/workspace_seed
      SOULCLAW_BOOTSTRAP_WIKI_ON_STARTUP: ${SOULCLAW_BOOTSTRAP_WIKI_ON_STARTUP:-true}
      SOULCLAW_BOOTSTRAP_SKILLS_ON_STARTUP: ${SOULCLAW_BOOTSTRAP_SKILLS_ON_STARTUP:-true}
      SOULCLAW_MCP_SEED_ON_STARTUP: ${SOULCLAW_MCP_SEED_ON_STARTUP:-true}
      SOULCLAW_MCP_CONFIG_FILE: ${SOULCLAW_MCP_CONFIG_FILE:-config/mcp_servers.yaml}
      SOULCLAW_DREAM_REVIEW_ENABLED: ${SOULCLAW_DREAM_REVIEW_ENABLED:-true}
      SOULCLAW_API_SCHEDULER_ENABLED: ${SOULCLAW_API_SCHEDULER_ENABLED:-false}
      SOULCLAW_DREAM_REVIEW_CRON: "${SOULCLAW_DREAM_REVIEW_CRON:-30 3 * * *}"
      SOULCLAW_DREAM_REVIEW_TIMEZONE: ${SOULCLAW_DREAM_REVIEW_TIMEZONE:-Asia/Shanghai}
      SOULCLAW_ADMIN_USERNAME: ${SOULCLAW_ADMIN_USERNAME:-admin}
      SOULCLAW_ADMIN_PASSWORD: ${SOULCLAW_ADMIN_PASSWORD:-soulclaw-admin}
      SOULCLAW_JWT_SECRET: ${SOULCLAW_JWT_SECRET:-change-me-for-production}
      SOULCLAW_A2A_BOOTSTRAP_SOULSEARCHER_ENABLED: ${SOULCLAW_A2A_BOOTSTRAP_SOULSEARCHER_ENABLED:-false}
      SOULCLAW_A2A_SOULSEARCHER_BASE_URL: ${SOULCLAW_A2A_SOULSEARCHER_BASE_URL:-http://127.0.0.1:8001}
      SOULCLAW_A2A_SOULSEARCHER_INTERNAL_API_KEY: ${SOULCLAW_A2A_SOULSEARCHER_INTERNAL_API_KEY:-}
      SOULCLAW_A2A_SOULSEARCHER_AUTH_USER_HEADER: ${SOULCLAW_A2A_SOULSEARCHER_AUTH_USER_HEADER:-X-SoulSearcher-User}
      SOULCLAW_A2A_SOULSEARCHER_USER_ID: ${SOULCLAW_A2A_SOULSEARCHER_USER_ID:-soulclaw}
      SOULCLAW_A2A_REQUIRE_PUBLIC_AUTH: ${SOULCLAW_A2A_REQUIRE_PUBLIC_AUTH:-true}
      SOULCLAW_A2A_PUBLIC_API_KEY: ${SOULCLAW_A2A_PUBLIC_API_KEY:-}
      SOULCLAW_SEARXNG_URL: ${SOULCLAW_SEARXNG_URL:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "${SOULCLAW_HOST_PORT:-8020}:8020"
    volumes:
      - soulclaw_data:/app/data
      - soulclaw_config:/app/config
      - soulclaw_workspace:/app/workspace
      - soulclaw_packages:/app/.packages

  soulclaw-worker:
    image: soulclaw:local
    container_name: soulclaw-worker
    profiles: ["background"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["celery", "-A", "backend.worker.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      SOULCLAW_REDIS_URL: redis://redis:6379/0
      SOULCLAW_REDIS_REQUIRED: "true"
      SOULCLAW_DATABASE_URL: ${SOULCLAW_DATABASE_URL:-postgresql+psycopg://soulclaw:soulclaw@postgres:5432/soulclaw}
      SOULCLAW_AGENT_ENGINE: ${SOULCLAW_AGENT_ENGINE:-langgraph}
      SOULCLAW_VECTOR_MODE: ${SOULCLAW_VECTOR_MODE:-required}
      SOULCLAW_EMBEDDING_MODEL: ${SOULCLAW_EMBEDDING_MODEL:-text-embedding-3-small}
      SOULCLAW_EMBEDDING_DIMENSIONS: ${SOULCLAW_EMBEDDING_DIMENSIONS:-1536}
      SOULCLAW_EMBEDDING_BATCH_SIZE: ${SOULCLAW_EMBEDDING_BATCH_SIZE:-32}
      SOULCLAW_EMBEDDING_PASS_DIMENSIONS: ${SOULCLAW_EMBEDDING_PASS_DIMENSIONS:-true}
      SOULCLAW_AUTO_MIGRATE: "false"
      SOULCLAW_WORKSPACE_SEED_DIR: /app/workspace_seed
      SOULCLAW_MCP_CONFIG_FILE: /app/config/mcp_servers.yaml
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SOULCLAW_LLM_PROVIDER: ${SOULCLAW_LLM_PROVIDER:-openai-compatible}
    env_file:
      - path: .env
        required: false
    volumes:
      - soulclaw_data:/app/data
      - soulclaw_config:/app/config
      - soulclaw_workspace:/app/workspace
      - soulclaw_packages:/app/.packages

  soulclaw-scheduler:
    image: soulclaw:local
    container_name: soulclaw-scheduler
    profiles: ["background"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "backend.worker.scheduler"]
    environment:
      SOULCLAW_REDIS_URL: redis://redis:6379/0
      SOULCLAW_REDIS_REQUIRED: "true"
      SOULCLAW_DATABASE_URL: ${SOULCLAW_DATABASE_URL:-postgresql+psycopg://soulclaw:soulclaw@postgres:5432/soulclaw}
      SOULCLAW_AGENT_ENGINE: ${SOULCLAW_AGENT_ENGINE:-langgraph}
      SOULCLAW_VECTOR_MODE: ${SOULCLAW_VECTOR_MODE:-required}
      SOULCLAW_AUTO_MIGRATE: "false"
      SOULCLAW_WORKSPACE_SEED_DIR: /app/workspace_seed
    env_file:
      - path: .env
        required: false
    volumes:
      - soulclaw_data:/app/data
      - soulclaw_config:/app/config
      - soulclaw_workspace:/app/workspace

  redis:
    image: redis:7-alpine
    container_name: soulclaw-redis
    profiles: ["background"]
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - soulclaw_redis:/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: soulclaw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soulclaw
      POSTGRES_USER: soulclaw
      POSTGRES_PASSWORD: soulclaw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulclaw -d soulclaw"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "${SOULCLAW_POSTGRES_PORT:-5432}:5432"
    volumes:
      - soulclaw_postgres:/var/lib/postgresql/data

volumes:
  soulclaw_data:
  soulclaw_config:
  soulclaw_workspace:
  soulclaw_redis:
  soulclaw_packages:
  soulclaw_postgres:
