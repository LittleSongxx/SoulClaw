name: soulclaw

services:
  soulclaw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        APT_MIRROR_URL: ${APT_MIRROR_URL:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    image: soulclaw:local
    container_name: soulclaw
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SOULCLAW_HOST: 0.0.0.0
      SOULCLAW_PORT: 8020
      SOULCLAW_LOG_LEVEL: ${SOULCLAW_LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
      SOULCLAW_REDIS_URL: redis://redis:6379/0
      SOULCLAW_DATABASE_URL: sqlite:////app/data/soulclaw.sqlite3
      SOULCLAW_WORKSPACE_SEED_DIR: /app/workspace_seed
      SOULCLAW_BOOTSTRAP_WIKI_ON_STARTUP: ${SOULCLAW_BOOTSTRAP_WIKI_ON_STARTUP:-true}
      SOULCLAW_BOOTSTRAP_SKILLS_ON_STARTUP: ${SOULCLAW_BOOTSTRAP_SKILLS_ON_STARTUP:-true}
      SOULCLAW_DREAM_REVIEW_ENABLED: ${SOULCLAW_DREAM_REVIEW_ENABLED:-true}
      SOULCLAW_API_SCHEDULER_ENABLED: ${SOULCLAW_API_SCHEDULER_ENABLED:-false}
      SOULCLAW_DREAM_REVIEW_CRON: "${SOULCLAW_DREAM_REVIEW_CRON:-30 3 * * *}"
      SOULCLAW_DREAM_REVIEW_TIMEZONE: ${SOULCLAW_DREAM_REVIEW_TIMEZONE:-Asia/Shanghai}
      SOULCLAW_ADMIN_USERNAME: ${SOULCLAW_ADMIN_USERNAME:-admin}
      SOULCLAW_ADMIN_PASSWORD: ${SOULCLAW_ADMIN_PASSWORD:-soulclaw-admin}
      SOULCLAW_JWT_SECRET: ${SOULCLAW_JWT_SECRET:-change-me-for-production}
      SOULCLAW_SEARXNG_URL: ${SOULCLAW_SEARXNG_URL:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "${SOULCLAW_HOST_PORT:-8020}:8020"
    volumes:
      - soulclaw_data:/app/data
      - soulclaw_config:/app/config
      - soulclaw_workspace:/app/workspace
      - soulclaw_packages:/app/.packages

  soulclaw-worker:
    image: soulclaw:local
    container_name: soulclaw-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "backend.worker.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      SOULCLAW_REDIS_URL: redis://redis:6379/0
      SOULCLAW_DATABASE_URL: sqlite:////app/data/soulclaw.sqlite3
      SOULCLAW_WORKSPACE_SEED_DIR: /app/workspace_seed
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - soulclaw_data:/app/data
      - soulclaw_config:/app/config
      - soulclaw_workspace:/app/workspace
      - soulclaw_packages:/app/.packages

  soulclaw-scheduler:
    image: soulclaw:local
    container_name: soulclaw-scheduler
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "backend.worker.scheduler"]
    environment:
      SOULCLAW_REDIS_URL: redis://redis:6379/0
      SOULCLAW_DATABASE_URL: sqlite:////app/data/soulclaw.sqlite3
      SOULCLAW_WORKSPACE_SEED_DIR: /app/workspace_seed
    env_file:
      - path: .env
        required: false
    volumes:
      - soulclaw_data:/app/data
      - soulclaw_config:/app/config
      - soulclaw_workspace:/app/workspace

  redis:
    image: redis:7-alpine
    container_name: soulclaw-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - soulclaw_redis:/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: soulclaw-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: soulclaw
      POSTGRES_USER: soulclaw
      POSTGRES_PASSWORD: soulclaw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulclaw -d soulclaw"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "${SOULCLAW_POSTGRES_PORT:-5432}:5432"
    volumes:
      - soulclaw_postgres:/var/lib/postgresql/data

volumes:
  soulclaw_data:
  soulclaw_config:
  soulclaw_workspace:
  soulclaw_redis:
  soulclaw_packages:
  soulclaw_postgres:
