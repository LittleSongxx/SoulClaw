name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff
        run: ruff check backend tests
      - name: Tests
        run: PYTHONPATH=. pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Build
        run: npm run build --prefix frontend

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soulclaw
          POSTGRES_PASSWORD: soulclaw
          POSTGRES_DB: soulclaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soulclaw -d soulclaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: SQLite migration bootstrap
        env:
          SOULCLAW_DATABASE_URL: sqlite:////tmp/soulclaw-ci.sqlite3
        run: |
          PYTHONPATH=. python - <<'PY'
          from backend.infra.db import migration_status, run_alembic_upgrade

          run_alembic_upgrade()
          status = migration_status()
          assert status["current_revision"] == status["head_revision"], status
          PY
      - name: Postgres Alembic upgrade
        env:
          SOULCLAW_DATABASE_URL: postgresql+psycopg://soulclaw:soulclaw@localhost:5432/soulclaw
        run: alembic upgrade head

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t soulclaw:ci .
      - name: Production compose requires secrets
        run: |
          if docker compose -f docker-compose.prod.yml config >/tmp/soulclaw-prod-missing.txt 2>&1; then
            cat /tmp/soulclaw-prod-missing.txt
            echo "docker-compose.prod.yml should reject missing required production variables"
            exit 1
          fi
      - name: Production compose config
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/tmp/soulclaw-prod.yml
